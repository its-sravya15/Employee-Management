<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }   
        body{
            font-family:Arial,sans-serif;
            background-color: #f5f5f5;
        }
        /*Navbar*/
        .navbar{
            background-color: #222;
            padding: 12px 25px;
            display:flex;
            align-items:center;
        }
        /*logo*/
        .logo{
            font-size:18px;
            font-weight:bold;
            color:white;
            margin-right:50px;
            white-space: nowrap;
        }
        /*Navigation links*/
        .nav-links{
            display:flex;
            align-items:center;
            list-style:none;
            gap: 15px;
        }
        .nav-links a:hover{
            color:#00bcd4;
        }
        /*login button*/
        .login-btn{
            border:1px solid #00bcd4;
            padding:8px 15px;
            border-radius:5px;
        }
        .login-btn:hover{
            background-color:#00bcd4;
            color: white !important;
        }
        /*Register button*/
        .register-btn{
            background-color:#00bcd4;
            padding:8px 15px;
            border-radius:5px;
        }
        .register-btn:hover{
            background-color:#0097a7;
            color:white !important;
        }
        /*content*/
        .content{
            padding:50px;
            text-align:center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
          Employee Management System
        </div>
        <ul class="nav-links">
           <li>
               <a href="/home">Home</a>
           </li>
           <li>
            <a href="/employees">employee </a>
            </li>
            <li>
            <a href="/addemployee">add employee</a>
             </li>
              <li>
            <a href="/search">search</a>
             </li>
            
             <li>
                <a href="/login">login</a>
            </li>
             <li> 
                <a href="/reglogin">register</a>
            </li>
       </ul>

    </nav>
    <div class="content">
        <h1>Welcome To  Employee Management System</h1>
        <p>Manage your employee easily</p>
    </div>
    
</body>
</html>
